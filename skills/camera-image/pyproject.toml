[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-image"
version = "0.1.0"
description = "Anima camera workflow skill for comfyui-chenxin-mcp."
requires-python = ">=3.10"
dependencies = [
    "comfyui-chenxin-mcp",
]

[project.entry-points."comfyui_chenxin_mcp.skills"]
camera-image = "camera_image.mcp_bridge:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["camera_image*", "runtime*"]
exclude = ["workflow*", "tests*", "test*", "*.tests", "*.tests.*"]