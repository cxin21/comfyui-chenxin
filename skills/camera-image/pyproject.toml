[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-image"
version = "0.3.0"
description = "Anima camera workflow skill (standalone, no MCP dependency)."
requires-python = ">=3.10"
dependencies = [
    "comfyui-http-runtime",
]

[project.scripts]
camera-image = "camera_image.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["camera_image*"]
exclude = ["workflow*", "tests*", "test*", "*.tests", "*.tests.*"]
