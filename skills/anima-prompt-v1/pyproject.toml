[project]
name = "anima-prompt-v1"
version = "1.0.0"
description = "Anima prompt skill with a full multi-source tag catalog"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
anima-catalog = "anima_prompt_v1.catalog.cli:main"

[project.entry-points."comfyui_chenxin_mcp.prompt_skills"]
anima-prompt-v1 = "anima_prompt_v1.mcp:get_prompt_skill"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["anima_prompt_v1*"]
exclude = ["agents*", "knowledge*", "references*", "tests*", "*.tests", "*.tests.*"]
